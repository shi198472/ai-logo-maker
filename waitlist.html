<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Logo Maker — Join the Waitlist</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #FEF9EF 0%, #A8E6CF 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #FF6B6B;
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #2D3436;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    p.subtitle {
      color: #636E72;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .features {
      text-align: left;
      margin-bottom: 32px;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      font-size: 15px;
      color: #2D3436;
    }
    .feature::before {
      content: "✅";
      font-size: 16px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input[type="email"] {
      padding: 16px 20px;
      border: 2px solid #E0E0E0;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input[type="email"]:focus {
      outline: none;
      border-color: #4ECDC4;
    }
    button {
      padding: 16px 20px;
      background: linear-gradient(135deg, #FF6B6B 0%, #4ECDC4 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(78, 205, 196, 0.3);
    }
    .count {
      margin-top: 20px;
      font-size: 14px;
      color: #636E72;
    }
    .count strong {
      color: #FF6B6B;
      font-weight: 700;
    }
    .success {
      display: none;
      padding: 20px;
      background: #A8E6CF;
      border-radius: 12px;
      color: #2D3436;
      font-weight: 600;
      margin-top: 16px;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card">
    <div class="badge">🚀 Coming Soon</div>
    <h1>AI Logo Maker</h1>
    <p class="subtitle">Professional logos in 30 seconds.<br>No design skills needed.</p>

    <div class="features">
      <div class="feature">5 unique concepts in 30 seconds</div>
      <div class="feature">Full brand kit included</div>
      <div class="feature">SVG/PNG/PDF — print ready</div>
      <div class="feature">Commercial license included</div>
    </div>

    <!-- ConvertKit Form -->
    <form id="waitlist-form" action="https://app.convertkit.com/forms/XXXXXXX/subscriptions" method="post" data-sv-form="XXXXXXX">
      <input type="email" name="email_address" placeholder="your@email.com" required />
      <button type="submit">🎨 Get Early Access + 50% Off</button>
    </form>

    <p class="count"><strong>427</strong> makers already on the waitlist</p>

    <div class="success" id="success-msg">
      🎉 You're in! We'll email you when we launch (soon).
    </div>
  </div>

  <script>
    // 简单表单提交处理（可替换为 ConvertKit / Buttondown 真实集成）
    document.getElementById('waitlist-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = this.querySelector('input[type="email"]').value;
      // 这里接入真实的邮件列表 API
      console.log('Waitlist signup:', email);
      this.style.display = 'none';
      document.getElementById('success-msg').style.display = 'block';
    });
  </script>
</body>
</html>
