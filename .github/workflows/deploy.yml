name: Deploy to Cloudflare Workers (OpenNext)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Debug - Check environment
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          echo "---"
          echo "Package.json exists: $(test -f package.json && echo 'yes' || echo 'no')"

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          echo "---"
          echo "node_modules/@opennextjs/cloudflare exists: $(test -d node_modules/@opennextjs/cloudflare && echo 'yes' || echo 'no')"

      - name: Build with OpenNext
        run: |
          echo "=== Step 1: Try next build directly ==="
          npx next build 2>&1 || echo "next build failed"
          echo ""
          echo "=== Step 2: Run OpenNext build ==="
          # 先检查二进制是否存在
          if [ -f "node_modules/.bin/opennextjs-cloudflare" ]; then
            echo "Using local binary..."
            node node_modules/@opennextjs/cloudflare/dist/cli/index.js build 2>&1
          else
            echo "Binary not found at expected path, listing:"
            ls -la node_modules/.bin/ | grep -i open
            echo "Trying npx..."
            npx --package @opennextjs/cloudflare opennextjs-cloudflare build 2>&1
          fi
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          echo "Checking .open-next directory..."
          if [ -d ".open-next" ]; then
            echo ".open-next directory exists"
            ls -la .open-next/
            if [ -f ".open-next/worker.js" ]; then
              echo "✅ worker.js found"
            else
              echo "❌ worker.js not found"
              exit 1
            fi
          else
            echo "❌ .open-next directory not found"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        run: |
          echo "Deploying to Cloudflare Workers..."
          ./node_modules/.bin/opennextjs-cloudflare deploy 2>&1 || {
            echo "Deploy with binary failed, trying npx..."
            npx opennextjs-cloudflare deploy 2>&1
          }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Get Worker URL
        run: |
          echo "✅ Deployment workflow completed!"
          echo "Worker URL should be: https://ai-logo-maker.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
