name: Deploy to Cloudflare Workers (OpenNext)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build with OpenNext
        run: npx opennextjs-cloudflare build
        env:
          NODE_ENV: production

      - name: Verify build output (list all files)
        run: |
          find .open-next -type f 2>/dev/null | head -30
          echo "---"
          if [ -f ".open-next/worker.js" ]; then
            echo "✅ worker.js found"
          else
            echo "⚠️ worker.js not found, listing .open-next:"
            ls -la .open-next/ 2>/dev/null || echo "no .open-next dir"
          fi

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: |
          echo "Deploying to Cloudflare Workers..."
          npx opennextjs-cloudflare deploy 2>&1 | tee deploy.log
          echo ""
          echo "=== deployment log end ==="
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Get Worker URL
        run: |
          echo "✅ Deployment complete!"
          echo "Worker URL: https://ai-logo-maker.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          echo ""
          echo "⚠️  请在 Cloudflare 仪表板配置自定义域名，或更新前端 API_URL"
