name: Deploy to Cloudflare Pages (OpenNext)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with OpenNext
        run: ./node_modules/.bin/opennextjs-cloudflare build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -f ".open-next/worker.js" ]; then
            echo "Error: .open-next/worker.js not found"
            exit 1
          fi
          echo "✅ OpenNext build verified"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .open-next/ --project-name=ai-logo-maker --yes

      - name: Verify deployment
        run: |
          echo "Deployment complete!"
          echo "Site URL: https://ai-logo-maker-a6d.pages.dev"
