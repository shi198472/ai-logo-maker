name: Deploy to Cloudflare Workers (OpenNext)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with OpenNext
        run: ./node_modules/.bin/opennextjs-cloudflare build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -f ".open-next/worker.js" ]; then
            echo "Error: .open-next/worker.js not found"
            exit 1
          fi
          echo "✅ OpenNext build verified"

      - name: Deploy to Cloudflare Workers
        run: |
          ./node_modules/.bin/opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Get Worker URL
        run: |
          echo "✅ Deployment complete!"
          echo "Worker URL: https://ai-logo-maker.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          echo ""
          echo "⚠️  请在 Cloudflare 仪表板配置自定义域名，或更新前端 API_URL"
