name: Deploy to Cloudflare Workers (OpenNext)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Debug build environment
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "PWD: $(pwd)"
          echo "Files:"
          ls -la node_modules/.bin/open* 2>&1
          ls node_modules/@opennextjs 2>&1

      - name: Build with OpenNext
        run: npx --no-install opennextjs-cloudflare build 2>&1

      - name: Verify build output
        run: |
          if [ -f ".open-next/worker.js" ]; then
            echo "✅ Build output found (worker.js)"
            ls -lh .open-next/worker.js
          else
            echo "❌ Build output missing"
            ls -la .open-next/ 2>/dev/null || echo ".open-next/ directory not found"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        run: |
          echo "Creating wrangler config..."
          cat > wrangler.toml << 'EOF'
          name = "ai-logo-maker"
          main = ".open-next/worker.js"
          compatibility_date = "2024-12-01"
          compatibility_flags = ["nodejs_compat"]

          # Workers AI Binding for Logo Generation
          [ai]
          binding = "AI"
          EOF
          echo "Deploying..."
          npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Done
        run: echo "✅ Deployment complete!"
